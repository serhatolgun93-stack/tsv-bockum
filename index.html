.home-hero{position:relative;overflow:hidden;padding:34px 24px;border-radius:20px;background:radial-gradient(ellipse at 83% 0%,#7a0a49 0%,transparent 55%),linear-gradient(135deg,#24202b,#0e0d14 72%);border:1px solid #6a214b;box-shadow:0 15px 40px #0005}

/* Fallback: splash always closes even if app JavaScript fails. */
@keyframes splashAutoDismiss{0%,98%{opacity:1;visibility:visible}100%{opacity:0;visibility:hidden;pointer-events:none}}
#splash{animation:splashAutoDismiss .35s ease 3.4s forwards!important}

</style><style id="splash-style">
#splash{position:fixed;inset:0;z-index:9999;overflow:hidden;display:flex;align-items:center;justify-content:center;background:radial-gradient(ellipse at 50% 43%,rgba(238,0,117,.27) 0%,rgba(110,10,67,.13) 34%,transparent 65%),linear-gradient(140deg,#1e1020 0%,#08090e 48%,#271024 100%);transition:opacity .55s ease,visibility .55s ease}
#splash::before{content:"";position:absolute;width:110vmax;height:65vmax;border:2px solid rgba(255,55,156,.17);border-radius:50%;transform:rotate(-21deg);box-shadow:0 0 85px rgba(233,0,110,.14),inset 0 0 90px rgba(233,0,110,.06);animation:orbitGlow 5s ease-in-out infinite alternate;pointer-events:none}

#splash.hide{opacity:0;visibility:hidden;pointer-events:none}

.splash-logo svg{width:100%;height:auto;display:block}
.splash-motto{position:relative;color:#fff;font-size:clamp(22px,5.4vw,36px);font-weight:900;text-align:center;line-height:1.22;letter-spacing:.6px;text-transform:uppercase;text-shadow:0 2px 18px rgba(255,26,143,.55);opacity:0;animation:mottoIn .75s cubic-bezier(.18,.85,.25,1) 1.25s forwards}
.splash-motto .accent{color:#ff3caa;text-shadow:0 0 24px rgba(255,36,153,.7)}
.splash-motto::after{content:"";display:block;height:3px;width:0;margin:13px auto 0;background:linear-gradient(90deg,transparent,#ff3caa,#fff,#ff3caa,transparent);border-radius:4px;animation:underlineIn .7s ease 1.85s forwards}
@keyframes logoIn{from{opacity:0;transform:translateY(17px) scale(.88)}to{opacity:1;transform:translateY(0) scale(1)}}
@keyframes mottoIn{from{opacity:0;transform:translateY(19px) scale(.95);filter:blur(5px)}to{opacity:1;transform:translateY(0) scale(1);filter:blur(0)}}
@keyframes underlineIn{to{width:82%}}

@media(prefers-reduced-motion:reduce){.splash-logo,.splash-motto,.splash-motto::after,#splash::before{animation:none;opacity:1;filter:none}.splash-motto::after{width:82%}#splash{transition:none}}

let widgetCodes={};try{widgetCodes=JSON.parse(localStorage.getItem(widgetStoreKey)||'{}')||{}}catch(e){widgetCodes={}}
const widgetKey=(t,mode)=>t+'::'+mode;
const officialWidgets={'A1::games':'<div class="fussballde_widget" data-id="4bf38c6d-f98b-4bb4-b11d-e50b7092e8c7" data-type="team-matches" style="width: 100%"></div><script type="text/javascript" src="https://www.fussball.de/widgets.js"><\/script>'};
Object.assign(widgetCodes,officialWidgets);

const widgetEditorOpen={};const widgetConsent={};
function widgetReload(t,mode){if(page==='Spielpläne')showMatchesHub();else teamView(t)}
function toggleWidgetEditor(t,mode){const k=widgetKey(t,mode);widgetEditorOpen[k]=!widgetEditorOpen[k];widgetReload(t,mode)}
function saveWidget(t,mode){const k=widgetKey(t,mode),v=document.getElementById('widgetCodeInput')?.value.trim()||'';if(v&&!/fussball\.de|dfbnet\.org/i.test(v)){alert('Bitte ausschließlich einen offiziellen FUSSBALL.DE-Einbettungscode verwenden.');return}if(v)widgetCodes[k]=v;else delete widgetCodes[k];try{localStorage.setItem(widgetStoreKey,JSON.stringify(widgetCodes))}catch(e){alert('Speichern im Browser ist fehlgeschlagen.')}widgetEditorOpen[k]=false;widgetConsent[k]=false;widgetReload(t,mode)}
function loadWidget(t,mode){widgetConsent[widgetKey(t,mode)]=true;widgetReload(t,mode)}
function upcomingPlaceholder(t,mode){const url=fussballLinks[t],k=widgetKey(t,mode),code=widgetCodes[k],title=mode==='games'?'Spielplan & Ergebnisse':'Ligatabelle';const editor=widgetEditorOpen[k]?`<div class="widget-editor"><h3>Offiziellen Widget-Code hinterlegen</h3><p>Auf <a href="https://next.fussball.de/widgets" target="_blank" rel="noopener noreferrer" style="color:#ff84c5">FUSSBALL.DE → Meine Widgets</a> das Widget für diese Mannschaft bzw. den Wettbewerb erstellen und den vollständigen Einbettungscode hier einfügen. Diese Einstellung wird nur in diesem Browser gespeichert, nicht für andere Besucher veröffentlicht.</p><textarea id="widgetCodeInput" spellcheck="false" placeholder="FUSSBALL.DE-Einbettungscode hier einfügen …">${esc(code||'')}</textarea><div class="widget-tools"><button class="primary" onclick="saveWidget(selectedTeam,${JSON.stringify(mode)})">Code lokal speichern</button><button onclick="toggleWidgetEditor(selectedTeam,${JSON.stringify(mode)})">Abbrechen</button></div></div>`:'';let main='';if(t==='A1'&&mode==='games'){main=`<p class="widget-state">Offizieller A1-Spielplan von FUSSBALL.DE</p><iframe class="widget-frame" title="TSV Bockum A1 – Spielplan" src="./a1-spielplan-eingebettet.html?v=1" style="width:100%;min-height:680px;border:0;background:#111115" loading="eager"></iframe><p><a href="./a1-spielplan.html?v=3">Spielplan separat öffnen</a></p>`;}else if(t==='A1'&&mode==='table'){main=`<p class="widget-state">Offizielle A1-Ligatabelle von FUSSBALL.DE</p><iframe class="widget-frame" title="TSV Bockum A1 – Tabelle" src="./a1-tabelle-eingebettet.html?v=1" style="width:100%;min-height:750px;border:0;background:#111115" loading="eager"></iframe><p><a href="./a1-tabelle.html?v=1">Tabelle separat öffnen</a></p>`;}else if(t==='B1'&&mode==='games'){main=`<p class="widget-state">Offizieller B1-Spielplan von FUSSBALL.DE</p><iframe class="widget-frame" title="TSV Bockum B1 – Spielplan" src="./b1-spielplan-eingebettet.html?v=2" style="width:100%;min-height:680px;border:0;background:#111115" loading="eager"></iframe><p><a href="./b1-spielplan.html?v=1">Spielplan separat öffnen</a></p>`;}else if(t==='B1'&&mode==='table'){main=`<p class="widget-state">Offizielle B1-Ligatabelle von FUSSBALL.DE</p><iframe class="widget-frame" title="TSV Bockum B1 – Tabelle" src="./b1-tabelle-eingebettet.html?v=1" style="width:100%;min-height:750px;border:0;background:#111115" loading="eager"></iframe><p><a href="./b1-tabelle.html?v=1">Tabelle separat öffnen</a></p>`;}else if(code){main=widgetConsent[k]?`<p class="widget-state">Externes FUSSBALL.DE-Widget wird geladen. Darstellung hängt von FUSSBALL.DE und dem gültigen Website-Schlüssel ab.</p><iframe class="widget-frame" title="${esc(t)} – ${esc(title)}" sandbox="allow-scripts allow-forms allow-popups allow-popups-to-escape-sandbox" referrerpolicy="strict-origin-when-cross-origin" srcdoc="${esc('<!doctype html><html><head><meta name="viewport" content="width=device-width, initial-scale=1"><style>body{margin:0;padding:10px;background:#111115;color:#fff;font-family:Arial,sans-serif}</style></head><body>'+code+'</body></html>')}"></iframe>`:`<p>Der Widget-Code ist lokal hinterlegt. Zum Laden wird eine Verbindung zu FUSSBALL.DE aufgebaut; dabei können Daten an den Anbieter übertragen werden.</p><div class="widget-tools"><button class="primary" onclick="loadWidget(selectedTeam,${JSON.stringify(mode)})">Widget laden</button></div>`}else{main=`<p>Für diese Ansicht ist noch kein offizieller FUSSBALL.DE-Widget-Code hinterlegt.</p><p>Bis dahin kannst du den ${mode==='games'?'Mannschaftsspielplan':'Wettbewerb und die Tabelle'} direkt auf FUSSBALL.DE öffnen.</p>`}return `<div class="data-placeholder"><div class="placeholder-icon">${mode==='games'?'▤':'▥'}</div><h2>${t==='Ü40'?'Spielplan':title}</h2>${main}<div class="widget-tools"><a href="${esc(url)}" target="_blank" rel="noopener noreferrer">FUSSBALL.DE öffnen ↗</a><button onclick="toggleWidgetEditor(selectedTeam,${JSON.stringify(mode)})">${code?'Widget-Code bearbeiten':'Widget einrichten'} ⚙</button></div>${editor}</div>`}

function teamView(t){if(!teamData[t])return;selectedTeam=t;if(t==='Ü40')profileTab='games';const d=teamData[t];document.getElementById('pageTitle').textContent=t;const c=document.getElementById('content');c.innerHTML=`<button class="backlink" onclick="go('Mannschaften')">← Alle Mannschaften</button><section class="home-hero"><div class="home-eyebrow">TSV BOCKUM · SAISON 2026/27</div><h1 class="home-title">${esc(t)}</h1><p class="home-sub">${t==='Ü40'?'Ü40-Kleinfeldspielrunde · Gruppe 5':'Mannschaftsprofil'}</p></section>${profileNav(t)}<div id="profileBody"></div>`;const b=document.getElementById('profileBody');if(profileTab==='team'&&t!=='Ü40'){b.innerHTML=`${d.sessions.length?'<h2 class="home-heading">Trainingszeiten</h2>'+d.sessions.map(x=>`<div class="schedule">${esc(x)}</div>`).join(''):''}${d.trainers.length||d.coaches.length?'<h2 class="home-heading">Trainerteam</h2>':''}${d.trainers.map(x=>personCard('Trainer/in',x)).join('')}${d.coaches.map(x=>personCard('Co-Trainer/in',x)).join('')}${d.care.length?'<h2 class="home-heading">Betreuung</h2>'+d.care.map(x=>personCard('Betreuer/in',x)).join(''):''}`}else{b.innerHTML=upcomingPlaceholder(t,profileTab)}}
function openTeam(t,tab='team'){profileTab=t==='Ü40'?'games':tab;teamView(t)}
function showMatchesHub(){if(selectedTeam==='Ü40')matchTab='games';const c=document.getElementById('content');c.innerHTML=`<h1>Spielpläne & Tabellen</h1><p>Wähle eine Mannschaft. Du kannst ihren offiziellen Spielplan öffnen oder einen FUSSBALL.DE-Widget-Code hinterlegen.</p><label class="muted" for="matchTeam">Mannschaft auswählen</label><select class="team-select" id="matchTeam" onchange="selectedTeam=this.value;showMatchesHub()">${teams.map(t=>`<option value="${esc(t)}" ${selectedTeam===t?'selected':''}>${esc(t)}</option>`).join('')}</select><div class="tabs">${(selectedTeam==='Ü40'?[['games','Spielplan']]:[['games','Spielplan & Ergebnisse'],['table','Tabelle']]).map(([id,label])=>`<button class="${matchTab===id?'active':''}" onclick="matchTab='${id}';showMatchesHub()">${label}</button>`).join('')}</div>${upcomingPlaceholder(selectedTeam,matchTab)}<button class="open-profile" onclick="openTeam(selectedTeam,matchTab)">Im Mannschaftsprofil öffnen ↗</button>`}

render();
{const params=new URLSearchParams(location.search),hashParams=new URLSearchParams(location.hash.slice(1)),team=hashParams.get('team')||params.get('team');if(team&&teamData[team]){page='Mannschaften';openTeam(team,'team')}}
