plugins { id 'com.android.application' }

android {
    namespace 'de.tsvbockum.app'
    compileSdk 35

    defaultConfig {
        applicationId 'de.tsvbockum.app'
        minSdk 24
        targetSdk 35
        versionCode Integer.parseInt(System.getenv('TSV_VERSION_CODE') ?: '2')
        versionName '1.1'
    }

    signingConfigs {
        release {
            def storePath = System.getenv('TSV_KEYSTORE_PATH')
            def storePasswordValue = System.getenv('TSV_KEYSTORE_PASSWORD')
            def keyAliasValue = System.getenv('TSV_KEY_ALIAS')
            def keyPasswordValue = System.getenv('TSV_KEY_PASSWORD')
            if (storePath && storePasswordValue && keyAliasValue && keyPasswordValue) {
                storeFile file(storePath)
                storePassword storePasswordValue
                keyAlias keyAliasValue
                keyPassword keyPasswordValue
            }
        }
    }

    buildTypes {
        release {
            signingConfig signingConfigs.release
            minifyEnabled false
        }
    }
}
