name: Build TSV Bockum Android APK
on:
  workflow_dispatch:
  push:
    paths:
      - 'android-app/**'
      - '.github/workflows/build-android-apk.yml'

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'
      - uses: android-actions/setup-android@v3
        with:
          packages: 'platform-tools platforms;android-35 build-tools;35.0.0'
      - uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: '8.7'
      - name: Verify signing secrets
        env:
          KEYSTORE_B64: ${{ secrets.TSV_KEYSTORE_BASE64 }}
          STORE_PASS: ${{ secrets.TSV_KEYSTORE_PASSWORD }}
          KEY_ALIAS: ${{ secrets.TSV_KEY_ALIAS }}
          KEY_PASS: ${{ secrets.TSV_KEY_PASSWORD }}
        run: |
          if [ -z "$KEYSTORE_B64" ] || [ -z "$STORE_PASS" ] || [ -z "$KEY_ALIAS" ] || [ -z "$KEY_PASS" ]; then
            echo "::error::Release signing is not configured. Add the four TSV_* GitHub Actions secrets first."
            exit 1
          fi
      - name: Decode signing keystore
        env:
          KEYSTORE_B64: ${{ secrets.TSV_KEYSTORE_BASE64 }}
        run: |
          printf '%s' "$KEYSTORE_B64" | base64 --decode > "$RUNNER_TEMP/tsv-bockum-release.jks"
          chmod 600 "$RUNNER_TEMP/tsv-bockum-release.jks"
      - name: Build signed release APK
        working-directory: android-app
        env:
          TSV_VERSION_CODE: ${{ github.run_number }}
          TSV_KEYSTORE_PATH: ${{ runner.temp }}/tsv-bockum-release.jks
          TSV_KEYSTORE_PASSWORD: ${{ secrets.TSV_KEYSTORE_PASSWORD }}
          TSV_KEY_ALIAS: ${{ secrets.TSV_KEY_ALIAS }}
          TSV_KEY_PASSWORD: ${{ secrets.TSV_KEY_PASSWORD }}
        run: gradle assembleRelease --no-daemon
      - name: Upload signed APK
        uses: actions/upload-artifact@v4
        with:
          name: TSV-Bockum-Signed-Release-APK
          path: android-app/app/build/outputs/apk/release/app-release.apk
          if-no-files-found: error
          retention-days: 30
